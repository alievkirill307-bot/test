      /*
  road
*/

*/

    <script id="rendered-js">
      // ------------------------------------------------------------
      // assets
      // ------------------------------------------------------------

      const ASSETS = {
        COLOR: {
          TAR: ["#959298", "#9c9a9d"],
          RUMBLE: ["#959298", "#f5f2f6"],
          GRASS: ["#eedccd", "#e6d4c5"],
        },

        IMAGE: {
          TREE: {
            src: "images/tree.png",
            width: 132,
            height: 192,
          },

          HERO: {
            src: "images/hero.png",
            width: 110,
            height: 56,
          },

          CAR: {
            src: "images/iCAR.png",
            width: 50,
            height: 36,
          },

          FINISH: {
            src: "images/finish.png",
            width: 339,
            height: 180,
            offset: -0.5,
          },

          SKY: {
            src: "images/cloud.jpg",
          },
        },

        AUDIO: {
          theme: "chocolate-chip-by-uncle-morris.mp3",
          engine: "https://s3-us-west-2.amazonaws.com/s.cdpn.io/155629/engine.wav",
          honk: "https://s3-us-west-2.amazonaws.com/s.cdpn.io/155629/honk.wav",
          beep: "https://s3-us-west-2.amazonaws.com/s.cdpn.io/155629/beep.wav",
        },
      };

      // ------------------------------------------------------------
      // helper functions
      // ------------------------------------------------------------

      Number.prototype.pad = function (numZeros, char = 0) {
        let n = Math.abs(this);
        let zeros = Math.max(0, numZeros - Math.floor(n).toString().length);
        let zeroString = Math.pow(10, zeros)
          .toString()
          .substr(1)
          .replace(0, char);
        return zeroString + n;
      };

      Number.prototype.clamp = function (min, max) {
        return Math.max(min, Math.min(this, max));
      };

      const timestamp = (_) => new Date().getTime();
      const accelerate = (v, accel, dt) => v + accel * dt;
      const isCollide = (x1, w1, x2, w2) => (x1 - x2) ** 2 <= (w2 + w1) ** 2;

      function getRand(min, max) {
        return (Math.random() * (max - min) + min) | 0;
      }

      function randomProperty(obj) {
        let keys = Object.keys(obj);
        return obj[keys[(keys.length * Math.random()) << 0]];
      }

      function drawQuad(element, layer, color, x1, y1, w1, x2, y2, w2) {
        element.style.zIndex = layer;
        element.style.background = color;
        element.style.top = y2 + `px`;
        element.style.left = x1 - w1 / 2 - w1 + `px`;
        element.style.width = w1 * 3 + `px`;
        element.style.height = y1 - y2 + `px`;

        let leftOffset = w1 + x2 - x1 + Math.abs(w2 / 2 - w1 / 2);
        element.style.clipPath = `polygon(${leftOffset}px 0, ${
          leftOffset + w2
        }px 0, 66.66% 100%, 33.33% 100%)`;
      }

      const KEYS = {};
      const keyUpdate = (e) => {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA"))
          return;
        KEYS[e.code] = e.type === `keydown`;
        e.preventDefault();
      };
      addEventListener(`keydown`, keyUpdate);
      addEventListener(`keyup`, keyUpdate);

      function sleep(ms) {
        return new Promise(function (resolve, reject) {
          setTimeout((_) => resolve(), ms);
        });
      }

      // ------------------------------------------------------------
      // objects
      // ------------------------------------------------------------

      class Line {
        constructor() {
          this.x = 0;
          this.y = 0;
          this.z = 0;

          this.X = 0;
          this.Y = 0;
          this.W = 0;

          this.curve = 0;
          this.scale = 0;

          this.elements = [];
          this.special = null;
        }

        project(camX, camY, camZ) {
          this.scale = camD / (this.z - camZ);
          this.X = (1 + this.scale * (this.x - camX)) * halfWidth;
          this.Y = Math.ceil(((1 - this.scale * (this.y - camY)) * height) / 2);
          this.W = this.scale * roadW * halfWidth;
        }

        clearSprites() {
          for (let e of this.elements) e.style.background = "transparent";
        }

        drawSprite(depth, layer, sprite, offset) {
          let destX = this.X + this.scale * halfWidth * offset;
          let destY = this.Y + 4;
          let destW = (sprite.width * this.W) / 265;
          let destH = (sprite.height * this.W) / 265;

          destX += destW * offset;
          destY += destH * -1;

          let obj = layer instanceof Element ? layer : this.elements[layer + 6];
          obj.style.background = `url('${sprite.src}') no-repeat`;
          obj.style.backgroundSize = `${destW}px ${destH}px`;
          obj.style.left = destX + `px`;
          obj.style.top = destY + `px`;
          obj.style.width = destW + `px`;
          obj.style.height = destH + `px`;
          obj.style.zIndex = depth;
        }
      }

      class Car {
        constructor(pos, type, lane) {
          this.pos = pos;
          this.type = type;
          this.lane = lane;

          var element = document.createElement("div");
          road.appendChild(element);
          this.element = element;
        }
      }

      class Audio {
        constructor() {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

          this.destination = this.audioCtx.createGain();
          this.destination.connect(this.audioCtx.destination);
          this.destination.gain.value = 0.5;

          this.files = {};
          this.generators = {};

          this.initGenerators();
        }

        initGenerators() {
          this.generators.engine = () => {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 80;
            gain.gain.value = 0.1;
            osc.connect(gain);
            gain.connect(this.destination);
            osc.start();
            osc.stop(this.audioCtx.currentTime + 0.1);
            return { osc, gain };
          };

          this.generators.honk = () => {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = 440;
            gain.gain.value = 0.2;
            osc.connect(gain);
            gain.connect(this.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.3);
            osc.stop(this.audioCtx.currentTime + 0.3);
          };

          this.generators.beep = () => {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.value = 0.15;
            osc.connect(gain);
            gain.connect(this.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.15);
            osc.stop(this.audioCtx.currentTime + 0.15);
          };
        }

        loadTheme() {
          const _self = this;
          const request = new XMLHttpRequest();
          request.open("GET", ASSETS.AUDIO.theme, true);
          request.responseType = "arraybuffer";
          request.onload = function () {
            _self.audioCtx.decodeAudioData(
              request.response,
              function (buffer) {
                _self.files.theme = buffer;
                _self.playTheme();
              },
              function () {
                console.warn('Failed to decode theme audio, using generated');
              }
            );
          };
          request.onerror = function () {
            console.warn('Failed to load theme audio');
          };
          request.send();
        }

        playTheme() {
          if (this.files.theme && !this.themeSource) {
            this.themeSource = this.audioCtx.createBufferSource();
            this.themeSource.buffer = this.files.theme;
            this.themeSource.loop = true;
            this.themeSource.connect(this.destination);
            this.themeSource.start(0);
          }
        }

        get volume() {
          return this.destination.gain.value;
        }

        set volume(level) {
          this.destination.gain.value = level;
        }

        play(key, pitch) {
          if (this.files[key]) {
            const source = this.audioCtx.createBufferSource();
            source.buffer = this.files[key];
            source.connect(this.destination);
            if (pitch) source.detune.value = pitch;
            source.start(0);
          } else if (this.generators[key]) {
            this.generators[key]();
          } else {
            this.loadFallback(key, () => this.play(key));
          }
        }

        loadFallback(src, key, callback) {
          const _self = this;
          const request = new XMLHttpRequest();
          request.open("GET", src, true);
          request.responseType = "arraybuffer";
          request.onload = function () {
            _self.audioCtx.decodeAudioData(
              request.response,
              function (buffer) {
                _self.files[key] = buffer;
                callback(key);
              },
              function () {}
            );
          };
          request.onerror = function () {};
          request.send();
        }

        load(src, key, callback) {
          this.loadFallback(src, key, callback);
        }
      }

      // ------------------------------------------------------------
      // global varriables
      // ------------------------------------------------------------

      // ------------------------------------------------------------
      // statistics (JSON in localStorage)
      // ------------------------------------------------------------

      const STATS_KEY = "gonki_stats_v1";

      function loadStats() {
        try {
          const data = JSON.parse(localStorage.getItem(STATS_KEY));
          if (data && Array.isArray(data.attempts)) return data;
        } catch (e) {}
        return { attempts: [] };
      }

      function saveStats(stats) {
        try {
          localStorage.setItem(STATS_KEY, JSON.stringify(stats, null, 2));
        } catch (e) {
          console.warn("Не удалось сохранить статистику", e);
        }
      }

      function addAttempt(result) {
        const stats = loadStats();
        stats.attempts.unshift({
          mode: gameMode,
          target: gameMode === "score" ? targetScore : 0,
          date: new Date().toLocaleString("ru-RU"),
          result: result,
          timeMs: timestamp() - start,
          timeStr: lap.innerText,
          score: Math.round(scoreVal),
          maxSpeed: Math.round(maxSpeedReached),
        });

        // keep only the last 50 attempts
        stats.attempts = stats.attempts.slice(0, 50);
        saveStats(stats);
        return stats;
      }

      function renderStats(stats) {
        const attempts = stats.attempts;
        const wins = attempts.filter((a) => a.result === "win").length;
        const loses = attempts.length - wins;
        const bestScore = attempts.reduce(
          (m, a) => Math.max(m, a.score),
          0
        );
        const bestTime = attempts
          .filter((a) => a.result === "win")
          .reduce((m, a) => (m === null || a.timeMs < m ? a.timeMs : m), null);

        const bestTimeStr = bestTime
          ? `${(bestTime / 60000) | 0}'${Math.floor((bestTime % 60000) / 1000).pad(2)}"${Math.floor(bestTime % 1000).pad(3)}`
          : "-";

        statsEl.innerHTML =
          `Попыток: <b>${attempts.length}</b> | Побед: <b>${wins}</b> | ` +
          `Поражений: <b>${loses}</b> | Рекорд: <b>${bestScore}</b> очк. | ` +
          `Лучшее время: <b>${bestTimeStr}</b>`;
      }

      function renderHighscore() {
        const stats = loadStats();
        const attempts = stats.attempts.slice(0, 12);
        let hN = Math.min(12, attempts.length);
        for (let i = 0; i < hN; i++) {
          const a = attempts[i];
          const cls = a.result === "win" ? "win" : "lose";
          const mark = a.result === "win" ? "WIN" : "LOSE";
          const tag = a.mode === "score" ? "СОРЕВН." : "ФИНИШ";
          highscore.children[i].className = cls;
          highscore.children[i].innerHTML =
            `${(i + 1).pad(2, "&nbsp;")}. ${a.date.slice(0, 10)} ${mark} ` +
            `${tag} ${a.score} очк. ${a.timeStr}`;
        }
        for (let i = hN; i < 12; i++) {
          highscore.children[i].innerHTML = "";
        }
      }

      function exportStats() {
        const blob = new Blob([JSON.stringify(loadStats(), null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "gonki_stats.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      const width = 800;
      const halfWidth = width / 2;
      const height = 500;
      const roadW = 4000;
      const segL = 200;
      const camD = 0.2;
      const H = 1500;
      const N = 70;

      const maxSpeed = 200;
      const accel = 38;
      const breaking = -80;
      const decel = -40;
      const maxOffSpeed = 40;
      const offDecel = -70;
      const enemy_speed = 8;
      const hitSpeed = 20;

      const LANE = {
        A: -2.3,
        B: -0.5,
        C: 1.2,
      };

      const mapLength = 15000;
      const FINISH_AHEAD = 55;

      // loop
      let then = timestamp();
      const targetFrameRate = 1000 / 25; // in ms

      let audio;

      // game
      let inGame,
        start,
        playerX,
        speed,
        scoreVal,
        pos,
        cloudOffset,
        sectionProg,
        mapIndex,
        countDown;
      let finishActive,
        finishLine,
        gameResult,
        maxSpeedReached;
      let statsEl, musicEl;
      let gameMode = "time", targetScore = 10000;
      let lines = [];
      let cars = [];

      // ------------------------------------------------------------
      // map
      // ------------------------------------------------------------

      function getFun(val) {
        return (i) => val;
      }

      function genMap() {
        let map = [];

        for (var i = 0; i < mapLength; i += getRand(0, 50)) {
          let section = {
            from: i,
            to: (i = i + getRand(300, 600)),
          };

          let randHeight = getRand(-5, 5);
          let randCurve = getRand(5, 30) * (Math.random() >= 0.5 ? 1 : -1);
          let randInterval = getRand(20, 40);

          if (Math.random() > 0.9)
            Object.assign(section, {
              curve: (_) => randCurve,
              height: (_) => randHeight,
            });
          else if (Math.random() > 0.8)
            Object.assign(section, {
              curve: (_) => 0,
              height: (i) => Math.sin(i / randInterval) * 1000,
            });
          else if (Math.random() > 0.8)
            Object.assign(section, {
              curve: (_) => 0,
              height: (_) => randHeight,
            });
          else
            Object.assign(section, {
              curve: (_) => randCurve,
              height: (_) => 0,
            });

          map.push(section);
        }

        map.push({
          from: i,
          to: i + N,
          curve: (_) => 0,
          height: (_) => 0,
          special: ASSETS.IMAGE.FINISH,
        });
        map.push({ from: Infinity });
        return map;
      }

      let map = genMap();

      // ------------------------------------------------------------
      // additional controls
      // ------------------------------------------------------------

      addEventListener(`keyup`, function (e) {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA"))
          return;

        if (e.code === "KeyM") {
          e.preventDefault();

          audio.volume = audio.volume === 0 ? 1 : 0;
          musicEl.muted = !musicEl.muted;
          return;
        }

        if (e.code === "KeyE") {
          e.preventDefault();

          if (inGame) return;

          if (confirm("Стереть всю статистику?")) {
            localStorage.removeItem(STATS_KEY);
            renderStats(loadStats());
            renderHighscore();
          }
          return;
        }

        if (e.code === "KeyC") {
          e.preventDefault();

          if (inGame) return;

          // музыка запускается по жесту пользователя
          musicEl.play().catch((_) => 0);
          if (audio.audioCtx.state === "suspended")
            audio.audioCtx.resume();

          sleep(0)
            .then((_) => {
              text.classList.remove("blink");
              text.innerText = 3;
              audio.play("beep");
              return sleep(1000);
            })
            .then((_) => {
              text.innerText = 2;
              audio.play("beep");
              return sleep(1000);
            })
            .then((_) => {
              reset();

              home.style.display = "none";

              road.style.opacity = 1;
              hero.style.display = "block";
              hud.style.display = "block";

              audio.play("beep", 500);

              inGame = true;
            });

          return;
        }

        if (e.code === "Escape") {
          e.preventDefault();

          reset();
        }
      });

      // ------------------------------------------------------------
      // game loop
      // ------------------------------------------------------------

      function update(step) {
        // prepare this iteration
        pos += speed;
        while (pos >= N * segL) pos -= N * segL;
        while (pos < 0) pos += N * segL;

        var startPos = (pos / segL) | 0;
        let endPos = (startPos + N - 1) % N;

        scoreVal += speed * step;
        if (gameMode === "time" && inGame)
          countDown = Math.max(0, countDown - step);

        // left / right position
        playerX -= (lines[startPos].curve / 5000) * step * speed;

        if (KEYS.ArrowRight)
          (hero.style.backgroundPosition = "-220px 0"),
            (playerX += 0.007 * step * speed);
        else if (KEYS.ArrowLeft)
          (hero.style.backgroundPosition = "0 0"),
            (playerX -= 0.007 * step * speed);
        else hero.style.backgroundPosition = "-110px 0";

        playerX = playerX.clamp(-3, 3);

        // speed

        if (inGame && KEYS.ArrowUp) speed = accelerate(speed, accel, step);
        else if (KEYS.ArrowDown) speed = accelerate(speed, breaking, step);
        else speed = accelerate(speed, decel, step);

        if (Math.abs(playerX) > 0.55 && speed >= maxOffSpeed) {
          speed = accelerate(speed, offDecel, step);
        }

        speed = speed.clamp(0, maxSpeed);

        // update map
        let current = map[mapIndex];
        let use = current.from < scoreVal && current.to > scoreVal;
        if (use) sectionProg += speed * step;
        lines[endPos].curve = use ? current.curve(sectionProg) : 0;
        lines[endPos].y = use ? current.height(sectionProg) : 0;
        lines[endPos].special = null;

        if (current.to <= scoreVal) {
          mapIndex++;
          sectionProg = 0;
        }

        // финиш появляется на горизонте после 1 минуты (только в режиме времени)
        if (gameMode === "time" && !finishActive && countDown <= 0) {
          finishActive = true;
          finishLine = (startPos + FINISH_AHEAD) % N;
        }

        // keep the finish gate standing on its line until it is crossed
        if (finishActive) lines[finishLine].special = ASSETS.IMAGE.FINISH;

        // win + UI

        if (!inGame) {
          speed = accelerate(speed, breaking, step);
          speed = speed.clamp(0, maxSpeed);
        } else if (gameMode === "score" && scoreVal >= targetScore) {
          finishGame("win");
        } else if (gameMode === "time" && lines[startPos].special) {
          finishGame("win");
        } else {
          maxSpeedReached = Math.max(maxSpeedReached, speed);

          if (gameMode === "time") {
            time.innerText = (countDown | 0).pad(3);
          } else {
            time.innerText = Math.max(0, targetScore - (scoreVal | 0)).pad(8);
          }
          score.innerText = (scoreVal | 0).pad(8);
          tacho.innerText = speed | 0;

          let cT = new Date(timestamp() - start);
          lap.innerText = `${cT.getMinutes()}'${cT.getSeconds().pad(2)}"${cT
            .getMilliseconds()
            .pad(3)}`;
        }

        // sound
        if (speed > 0) audio.play("engine", speed * 4);

        // draw cloud
        cloud.style.backgroundPosition = `${
          (cloudOffset -= lines[startPos].curve * step * speed * 0.13) | 0
        }px 0`;

        // other cars
        for (let car of cars) {
          car.pos = (car.pos + enemy_speed * step) % N;

          // respawn
          if ((car.pos | 0) === endPos) {
            if (speed < 30) car.pos = startPos;
            else car.pos = endPos - 2;
            car.lane = randomProperty(LANE);
          }

          // collision
          const offsetRatio = 5;
          if (
            (car.pos | 0) === startPos &&
            isCollide(playerX * offsetRatio + LANE.B, 0.5, car.lane, 0.5)
          ) {
            speed = Math.min(hitSpeed, speed);
            if (inGame) audio.play("honk");
          }
        }

        // draw road
        let maxy = height;
        let camH = H + lines[startPos].y;
        let x = 0;
        let dx = 0;

        for (let n = startPos; n < startPos + N; n++) {
          let l = lines[n % N];
          let level = N * 2 - n;

          // update view
          l.project(
            playerX * roadW - x,
            camH,
            startPos * segL - (n >= N ? N * segL : 0)
          );
          x += dx;
          dx += l.curve;

          // clear assets
          l.clearSprites();

          // first draw section assets
          if (n % 10 === 0) l.drawSprite(level, 0, ASSETS.IMAGE.TREE, -2);
          if ((n + 5) % 10 === 0)
            l.drawSprite(level, 0, ASSETS.IMAGE.TREE, 1.3);

          if (l.special)
            l.drawSprite(level, 0, l.special, l.special.offset || 0);

          for (let car of cars)
            if ((car.pos | 0) === n % N)
              l.drawSprite(level, car.element, car.type, car.lane);

          // update road

          if (l.Y >= maxy) continue;
          maxy = l.Y;

          let even = ((n / 2) | 0) % 2;
          let grass = ASSETS.COLOR.GRASS[even * 1];
          let rumble = ASSETS.COLOR.RUMBLE[even * 1];
          let tar = ASSETS.COLOR.TAR[even * 1];

          let p = lines[(n - 1) % N];

          drawQuad(
            l.elements[0],
            level,
            grass,
            width / 4,
            p.Y,
            halfWidth + 2,
            width / 4,
            l.Y,
            halfWidth
          );
          drawQuad(
            l.elements[1],
            level,
            grass,
            (width / 4) * 3,
            p.Y,
            halfWidth + 2,
            (width / 4) * 3,
            l.Y,
            halfWidth
          );

          drawQuad(
            l.elements[2],
            level,
            rumble,
            p.X,
            p.Y,
            p.W * 1.15,
            l.X,
            l.Y,
            l.W * 1.15
          );
          drawQuad(l.elements[3], level, tar, p.X, p.Y, p.W, l.X, l.Y, l.W);

          if (!even) {
            drawQuad(
              l.elements[4],
              level,
              ASSETS.COLOR.RUMBLE[1],
              p.X,
              p.Y,
              p.W * 0.4,
              l.X,
              l.Y,
              l.W * 0.4
            );
            drawQuad(
              l.elements[5],
              level,
              tar,
              p.X,
              p.Y,
              p.W * 0.35,
              l.X,
              l.Y,
              l.W * 0.35
            );
          }
        }
      }

      // ------------------------------------------------------------
      // init
      // ------------------------------------------------------------

      function reset() {
        inGame = false;

        start = timestamp();

        // финиш появляется на горизонте через 1 минуту, проиграть нельзя
        countDown = 60;

        playerX = 0;
        speed = 0;
        scoreVal = 0;

        pos = 0;
        cloudOffset = 0;
        sectionProg = 0;
        mapIndex = 0;

        finishActive = false;
        finishLine = -1;
        gameResult = null;
        maxSpeedReached = 0;

        for (let line of lines) line.curve = line.y = line.special = null;

        text.innerText = "INSERT COIN";
        text.classList.add("blink");

        time.classList.toggle("scoreMode", gameMode === "score");
        document
          .getElementById("score-target-wrap")
          .classList.toggle("hidden", gameMode !== "score");

        renderStats(loadStats());
        renderHighscore();

        road.style.opacity = 0.4;
        hud.style.display = "none";
        home.style.display = "block";
        tacho.style.display = "block";
      }

      function finishGame(result) {
        inGame = false;
        gameResult = result;

        // бонус за финиш
        if (result === "win") {
          scoreVal += 2000;
        }

        const stats = addAttempt(result);
        renderStats(stats);
        renderHighscore();

        text.classList.remove("blink");
        if (result === "win") {
          text.innerText = `ФИНИШ! Счёт: ${(scoreVal | 0).pad(8)}`;
        } else {
          text.innerText = "ВРЕМЯ ВЫШЛО!";
        }

        tacho.style.display = "none";
        home.style.display = "block";
        road.style.opacity = 0.4;
      }

      function init() {
        game.style.width = width + "px";
        game.style.height = height + "px";

        hero.style.top = height - 80 + "px";
        hero.style.left = halfWidth - ASSETS.IMAGE.HERO.width / 2 + "px";
        hero.style.background = `url(${ASSETS.IMAGE.HERO.src})`;
        hero.style.width = `${ASSETS.IMAGE.HERO.width}px`;
        hero.style.height = `${ASSETS.IMAGE.HERO.height}px`;

        cloud.style.backgroundImage = `url(${ASSETS.IMAGE.SKY.src})`;

        statsEl = document.getElementById("stats");
        musicEl = document.getElementById("bg-music");
        document
          .getElementById("export-stats")
          .addEventListener("click", exportStats);

        const modeButtons = document.querySelectorAll("#mode button");
        const targetWrap = document.getElementById("score-target-wrap");
        const targetInput = document.getElementById("score-target");
        modeButtons.forEach((btn) =>
          btn.addEventListener("click", () => {
            gameMode = btn.dataset.mode;
            modeButtons.forEach((b) =>
              b.classList.toggle("active", b === btn)
            );
            targetWrap.classList.toggle("hidden", gameMode !== "score");
            time.classList.toggle("scoreMode", gameMode === "score");
          })
        );
        targetInput.addEventListener("input", () => {
          const val = parseInt(targetInput.value, 10);
          targetScore = Math.max(100, val || 10000);
        });

        audio = new Audio();
        Object.keys(ASSETS.AUDIO).forEach((key) =>
          audio.load(ASSETS.AUDIO[key], key, (_) => 0)
        );

        // музыка стартует при первом действии пользователя
        const startMusicOnce = () => {
          musicEl.play().catch((_) => 0);
          if (audio.audioCtx.state === "suspended")
            audio.audioCtx.resume();
        };
        document.addEventListener("keydown", startMusicOnce, { once: true });
        document.addEventListener("click", startMusicOnce, { once: true });

        cars.push(new Car(0, ASSETS.IMAGE.CAR, LANE.C));
        cars.push(new Car(10, ASSETS.IMAGE.CAR, LANE.B));
        cars.push(new Car(20, ASSETS.IMAGE.CAR, LANE.C));
        cars.push(new Car(35, ASSETS.IMAGE.CAR, LANE.C));
        cars.push(new Car(50, ASSETS.IMAGE.CAR, LANE.A));
        cars.push(new Car(60, ASSETS.IMAGE.CAR, LANE.B));
        cars.push(new Car(70, ASSETS.IMAGE.CAR, LANE.A));

        for (let i = 0; i < N; i++) {
          var line = new Line();
          line.z = i * segL + 270;

          for (let j = 0; j < 6 + 2; j++) {
            var element = document.createElement("div");
            road.appendChild(element);
            line.elements.push(element);
          }

          lines.push(line);
        }

        for (let i = 0; i < 12; i++) {
          var element = document.createElement("p");
          highscore.appendChild(element);
        }
        renderHighscore();

        reset();

        // START GAME LOOP
        (function loop() {
          requestAnimationFrame(loop);

          let now = timestamp();
          let delta = now - then;

          if (delta > targetFrameRate) {
            update(delta / 1000);
            then = now;
          }
        })();
      }

      init();
      //# sourceURL=pen.js
    </script>
  </body>
